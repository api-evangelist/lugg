aid: lugg
name: Lugg
description: >-
  Lugg is an on-demand moving and delivery service that connects customers with
  background-checked movers and trucks for same-day and scheduled jobs across
  20+ U.S. metropolitan areas. Beyond consumer moves, Lugg handles furniture and
  appliance delivery, junk removal and donation pickups, and labor-only help,
  with real-time tracking and in-app payment. Lugg also publishes a partner /
  developer REST API (documented at docs.lugg.com, served from api.lugg.com)
  that lets retailers, marketplaces, and platforms embed Lugg delivery: it
  exposes OAuth2 authentication, quotes, bookings and multi-stop booking flows,
  schedules, and webhook endpoints, with a documented sandbox environment,
  pagination, rate limiting, and error semantics. Lugg is a Y Combinator-backed
  company.
